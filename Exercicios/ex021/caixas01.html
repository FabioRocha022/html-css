<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de caixas</title>
    <style>
        h1{ /* box-level */
            
            background-color: lightblue;
            height: 300px;
            width: 300px ;
            border-width: 10px;
            border-style: solid;
            border-color: darkslategray;
            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;
            margin: 20px auto 40px auto  ;
            outline: 5px dashed salmon ;
            
        }
        a{ /* iniline-level */
            
            border: red 10px solid ;
           ;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixas de box-level</h1>
    <p>Paragrafos são exemplos de box-level, mas os <a href="#"> links</a> são exemplos de caixas inline-level. Vamos ver como isso funciona.</p>
</body>
</html>
