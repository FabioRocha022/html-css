<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php
    " method="post">
    <div>
        <label for="inivel">Nivel de Sastifação</label>
        <input type="range" name="inivel" id="inivel" min="1" max="10" value="1">
    </div>
    <div>
        <label for="icor">Cor</label>
        <input type="color" name="icolor" id="icolor">
    </div>
    <div>
        <label for="ifoto">Foto de Perfil</label>
        <input type="file" name="ifoto" id="ifoto">
    </div>
    <div>
        <input type="submit" value="Enviar"> 
        <input type="reset" value="Limpar">
    </div>
</form>
</body>
</html>
