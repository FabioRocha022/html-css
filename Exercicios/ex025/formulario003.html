<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Testde de formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <label for="inome">Nome: </label>
        <input type="text" name="inome" id="inome" required
        maxlength="30" autocomplete="name" placeholder="Nome Completo" >
        <label for="imedia">Média:</label>
        <input type="number" name="imedia" id="imedia" placeholder="Colque a sua média" min="0" max="200">
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </form>
    
</body>
</html>
