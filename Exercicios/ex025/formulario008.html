<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php
    " method="post">

    <div>
        <label for="inu1">Numero 1:</label>
        <input type="number" name="inu1" id="inu1" min="0" max="50" required oninput="isoma.innerHTML = Number(inu1.value) + Number
        (inu2.value)">
    </div>

    <div>
        <label for="inu2">Numero 2:</label>
        <input type="number" name="inu2" id="inu2" min="0" max="50" required oninput="isoma.innerHTML = Number(inu1.value) + Number
        (inu2.value)">
    </div>

    <div>
        <label for="isoma">Soma:</label>
        <output name="isoma" id="isoma">0</output>
    </div>

    <div>
        <input type="submit" value="Enviar"> 
        <input type="reset" value="Limpar">
    </div>
    </form>
</body>
</html>
