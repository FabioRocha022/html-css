<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela de preços</title>
    <style>
        * {
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        
        body {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        table{
            width: 60%;
            border-collapse: collapse;
            border-radius: 5px;
        }

        td, th {
            border: 1px solid black;
            padding: 10px;
        }

    </style>
</head>
<body>
        <table>
            <thead>
                <tr>
                    <th scope="row">Plano</th>
                    <td>Start</td>
                    <td>Plus</td>
                    <td>Ultimate</td>
                </tr>
                <tr>
                    <th>Preço</th>
                    <td>25.99€</td>
                    <td>35.99€</td>
                    <td>45.99€</td>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th>Disk Space</th>
                    <td></td>
                    <td></td>
                    <td></td>
                </tr>
                <tr>
                    <th>Bandwidth</th>
                    <td></td>
                    <td></td>
                    <td></td>
                </tr>
                <tr>
                    <th>DataBae</th>
                    <td></td>
                    <td></td>
                    <td></td>
                </tr>
                <tr>
                    <th>Support</th>
                    <td></td>
                    <td></td>
                    <td></td>
                </tr>
            </tbody>
            <tfoot>

            </tfoot>
        </table>
</body>
</html>
