<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>
</head>
<body>
    <h1>Imagem dinâmica</h1>
    <p>Tente abrir este site em vários dispositivos diferentes.</p>
    <picture>
        <source media="(max-width:750px)" srcset="imagens/foto-p.png" type="image/PNG">
        <source media="(max-width:1050px)" srcset="imagens/foto-m.png" type="image/PNG">
        <img src="imagens/foto-g.png" alt="Imagem flexível">
        
    </picture>
    <h1>Reproduzir audios!</h1>
    <p>Vamos <ins>reproduzir audios</ins></p>
    <audio  
        controls loop  preload="metadata">    
        <source src="audio/guanacast-33.mp3" type="audio/mpeg">
        <source src="audio/guanacast-33.mp3" type="audio/ogg">
        <source src="audio/guanacast-33.mp3" type="audio/wab">
        <p>Infelizmente o seu navegador não é compativel para reproduzir nenhum dos audios. <br> Tente fazer <strong><ins>dowonload</ins></strong>, clique <a href="audio/guanacast-33.mp3">aqui</a>!</p>
</audio>
<p><a href=""></a></p>
    
</body>
</html>
