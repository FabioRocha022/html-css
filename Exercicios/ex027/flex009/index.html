<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
            background-color: darkblue;
            display: flex;
            flex-flow: nowrap row;
        }

        div.item {
            background-color: darkcyan;
            border: 1px solid red;
            text-align: center;
            flex-basis: 190px;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">A
            A A</div>
        <div class="item">Lorem ipsum dolor sit amet consectetur adipisicing elit. Corrupti magnam architecto incidunt, ullam quidem sit. Sed illo necessitatibus facilis fugit delectus, ut minus unde quod quae, eaque ratione repellat qui!</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
    </div>
</body>
</html>
